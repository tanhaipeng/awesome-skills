<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460"
     font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="900" height="460" fill="#FFFFFF"/>
  <text x="60" y="54" font-size="28" font-weight="700" fill="#0F172A">示意图模板</text>
  <text x="60" y="82" font-size="13" fill="#64748B">复制这个文件开始画：改框、改字、跑 render-svg.sh</text>

  <rect x="90" y="140" width="260" height="100" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="220" y="180" font-size="16" font-weight="600" fill="#312E81" text-anchor="middle">上游</text>
  <text x="220" y="206" font-size="11.5" fill="#4338CA" text-anchor="middle">应用 / 客户端</text>

  <path d="M 350 190 L 538 190" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="444" y="180" font-size="11" fill="#475569" text-anchor="middle">数据流</text>

  <rect x="540" y="140" width="260" height="100" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="670" y="180" font-size="16" font-weight="600" fill="#065F46" text-anchor="middle">下游</text>
  <text x="670" y="206" font-size="11.5" fill="#047857" text-anchor="middle">服务 / 存储</text>

  <rect x="90" y="300" width="710" height="90" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="110" y="326" font-size="12.5" fill="#64748B">虚线框表示边界（主机 / 网络 / 部署单元）</text>
  <text x="110" y="352" font-size="11.5" fill="#475569">框内可以继续嵌套，逐层内缩 28px，标签写在左上角</text>

  <text x="450" y="430" font-size="11.5" fill="#94A3B8" text-anchor="middle">脚注：解释颜色和箭头方向，让图能自解释</text>
</svg>
